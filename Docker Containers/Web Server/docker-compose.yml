version: '3.8'
networks:
  devnetwork:
    external: true
services:
  my-cv:
    image: 'mycvimage'
    networks:
      - devnetwork
    ports:
      - 8082:80
    container_name: My-CV
    restart: unless-stopped
  it-tools:
    image: 'corentinth/it-tools:latest'
    networks:
      - devnetwork
    ports:
      - '8080:80'
    restart: unless-stopped
    container_name: IT-Tools
